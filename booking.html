<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <title>حجز الكشف</title>
  </head>
  <body>
    <header>
      <h1>احجز كشفك</h1>
      <nav>
        <a href="index.html" >الرئيسية</a>
        <a href="doctors.html" >الأطباء</a>
        <a href="booking.html" >احجز كشف</a>
      </nav>
      <hr>
    </header>

    <main>
      <form action="" method="get">
        <div>
          <label for="name">الاسم:</label>  
          <input type="text" id="name" required placeholder="اكتب اسمك" checked>
        </div>
        <br>
        <div>
          <label for="tel"> رقم التيليفون:</label> 
          <input type="tel" id="tel" required placeholder="01000000000" minlength="11" maxlength="11">
        </div>
        <br>
        <div>
          <label for="mail">الإيميل</label>
          <input type="email" id="mail" required placeholder="example@mail.com">
        </div>
        <br>
        <div>
          <label for="age">السن</label>
          <input type="number" id="age" min="1" max="100" required> 
        </div>
        <br>
        <div>
          <label for="clinic">نوع الكشف</label>
          <select id="clinic" name="clinic">
            <optgroup label="باطنة">
              <option>د. أحمد محمد</option>
              <option>د. محمود حسن</option>
            </optgroup>
              <optgroup label="أسنان">
              <option>د. سارة علي</option>
            </optgroup>
            <optgroup label="عظام">
              <option>د. خالد عمر</option>
            </optgroup>
          </select>
        </div>
        
        <br>

        <div>
          <label>الفترة:</label>
          <input type="radio" name="time" id="morning" value="morning">
          <label for="morning">صباحاً</label>

          <input type="radio" name="time" id="evening" value="evening">
          <label for="evening">مساءً</label>
        </div>

        <br>
        <div>
          <label for="problem">اشرح شكوتك</label>
          <textarea id="problem" row="5" cols="30" name="problem" placeholder="اشرح شكوتك"></textarea>
        </div>
        
        <br>

        <div>
          <input type="checkbox" id="agree" required>
          <label for="agree">أوافق على الشروط</label>
        </div>

        <br>

          <input type="submit" value="احجز الان" aria-label="احجز كشفك الان في عيادة الشفاء">
          <input type="reset" value="مسح البيانات">
      </form> 
    </main>
  </body>
</html>
